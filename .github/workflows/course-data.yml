# Downloads course data and satellite imagery on GitHub's servers (they can
# reach map services; the development environment can't) and commits the
# results back to the same branch. Each step saves what it got, so a slow
# or failed run still keeps its progress and the next run continues.
name: course-data

on:
  push:
    paths:
      - "tools/**"
      - ".github/workflows/course-data.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: course-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up git
        run: |
          git config user.name "course-data bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cat > /tmp/save.sh <<'SH'
          set -e
          for p in data courses; do [ -e "$p" ] && git add -A "$p"; done
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "$1"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          SH
      - name: Download OpenStreetMap course data
        run: python tools/osm_fetch.py
        timeout-minutes: 60
        continue-on-error: true
      - name: Save downloaded data
        if: always()
        run: bash /tmp/save.sh "Update OpenStreetMap course data [automated]"
      - name: Build course files and render hole images
        run: |
          pip install --quiet pillow==11.0.0
          python tools/build_courses.py
        timeout-minutes: 40
      - name: Save course files and images
        if: always()
        run: bash /tmp/save.sh "Build course files and hole images [automated]"
